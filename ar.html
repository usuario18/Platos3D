<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Platos 360 · AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Helvetica Neue', sans-serif; overflow: hidden; height: 100vh; }

    /* SPLASH */
    #splash {
      position: fixed; inset: 0; z-index: 100;
      background: #0d1621;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      transition: opacity .5s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .splash-logo {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: #c8a84b; margin-bottom: 28px;
    }
    .splash-title {
      font-size: clamp(28px, 7vw, 46px); font-weight: 300;
      color: #fff; text-align: center; line-height: 1.2; margin-bottom: 10px;
    }
    .splash-title span { color: #c8a84b; }
    .splash-sub {
      font-size: 13px; color: rgba(255,255,255,0.4);
      text-align: center; line-height: 1.6; max-width: 280px; margin-bottom: 36px;
    }
    .card-preview {
      width: min(320px, 85vw);
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(200,168,75,0.35);
      margin-bottom: 32px;
      box-shadow: 0 0 48px rgba(200,168,75,0.12);
    }
    .card-preview img { width: 100%; display: block; }

    .scan-hint {
      font-size: 12px; color: rgba(200,168,75,0.7);
      letter-spacing: 1px; margin-bottom: 28px; text-align: center;
    }

    .start-btn {
      background: #c8a84b; color: #0d1621;
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      padding: 15px 36px; border: none; cursor: pointer;
      border-radius: 2px; transition: opacity .2s; margin-bottom: 14px;
      font-weight: 600;
    }
    .start-btn:hover { opacity: 0.85; }
    .hint { font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 1px; }

    /* LOADING */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      background: #0d1621;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #loading.active { display: flex; }
    .loading-logo { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #c8a84b; }
    .loading-text { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .bar-bg { width: 200px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; }
    .bar { height: 100%; width: 0%; background: #c8a84b; border-radius: 1px; transition: width .25s; }
    .bar-pct { font-size: 12px; color: #c8a84b; }

    /* AR UI */
    #ar-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
    #ar-ui.active { display: block; }

    .ar-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 18px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .ar-brand { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #c8a84b; }
    .ar-close {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: all;
      color: #fff; font-size: 18px;
    }

    .ar-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 28px; text-align: center;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }
    .scan-pill {
      display: inline-flex; align-items: center; gap: 9px;
      background: rgba(13,22,33,0.6);
      border: 1px solid rgba(200,168,75,0.4);
      padding: 10px 20px; border-radius: 24px;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff;
    }
    .scan-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #c8a84b;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    #ar-container { display: none; position: fixed; inset: 0; z-index: 5; }
  </style>
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <p class="splash-logo">Platos 360</p>
    <h1 class="splash-title">Apunta a la<br><span>tarjeta</span></h1>
    <p class="splash-sub">El plato 3D aparecerá flotando sobre ella y seguirá cada movimiento</p>
    <div class="card-preview">
      <img src="Tarjeta_B.png" alt="Tarjeta Platos 360">
    </div>
    <p class="scan-hint">↑ Apunta con tu cámara aquí</p>
    <button class="start-btn" id="start-btn">Activar cámara AR</button>
    <p class="hint">Sin descargar apps · Solo abre y apunta</p>
  </div>

  <!-- LOADING -->
  <div id="loading">
    <p class="loading-logo">Platos 360</p>
    <p class="loading-text">Iniciando AR...</p>
    <div class="bar-bg"><div class="bar" id="bar"></div></div>
    <p class="bar-pct" id="bar-pct">0%</p>
  </div>

  <!-- AR UI OVERLAY -->
  <div id="ar-ui">
    <div class="ar-top">
      <span class="ar-brand">Platos 360 · AR</span>
      <div class="ar-close" id="ar-close">×</div>
    </div>
    <div class="ar-bottom">
      <div class="scan-pill">
        <div class="scan-dot"></div>
        <span id="scan-msg">Apunta a la tarjeta</span>
      </div>
    </div>
  </div>

  <!-- A-FRAME AR SCENE -->
  <div id="ar-container">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: Tarjeta_Presentacion.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="dish" src="Alcachofas_Test_01.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Sombra suave -->
        <a-circle
          position="0 0.001 0"
          rotation="-90 0 0"
          radius="0.55"
          material="color: #000; opacity: 0.2; transparent: true; side: double">
        </a-circle>

        <!-- Modelo 3D flotando y rotando -->
        <a-gltf-model
          src="#dish"
          position="0 0.35 0"
          scale="0.9 0.9 0.9"
          animation__rotate="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 7000; easing: linear"
          animation__float="property: position; from: 0 0.3 0; to: 0 0.42 0; loop: true; dur: 2000; easing: easeInOutSine; dir: alternate">
        </a-gltf-model>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="1 3 1" color="#fff5e0" intensity="1.4"></a-light>
        <a-light type="point" position="0 1 0" color="#c8a84b" intensity="0.3" distance="3"></a-light>
      </a-entity>

    </a-scene>
  </div>

<script>
  const splash   = document.getElementById('splash');
  const loading  = document.getElementById('loading');
  const arUI     = document.getElementById('ar-ui');
  const arCont   = document.getElementById('ar-container');
  const startBtn = document.getElementById('start-btn');
  const arClose  = document.getElementById('ar-close');
  const scanMsg  = document.getElementById('scan-msg');
  const bar      = document.getElementById('bar');
  const barPct   = document.getElementById('bar-pct');
  let mindStarted = false;

  function setBar(pct) {
    bar.style.width = pct + '%';
    barPct.textContent = Math.round(pct) + '%';
  }

  startBtn.addEventListener('click', async () => {
    splash.classList.add('hidden');
    loading.classList.add('active');
    arCont.style.display = 'block';

    const scene = document.getElementById('ar-scene');

    let fakePct = 0;
    const ticker = setInterval(() => {
      fakePct = Math.min(fakePct + Math.random() * 6, 88);
      setBar(fakePct);
    }, 180);

    const waitLoaded = new Promise(res => {
      if (scene.hasLoaded) { res(); return; }
      scene.addEventListener('loaded', res, { once: true });
    });
    await waitLoaded;

    const target = scene.querySelector('[mindar-image-target]');
    target.addEventListener('targetFound', () => {
      scanMsg.textContent = '¡Tarjeta detectada! 🍽️';
      scanMsg.style.color = '#c8a84b';
    });
    target.addEventListener('targetLost', () => {
      scanMsg.textContent = 'Apunta a la tarjeta';
      scanMsg.style.color = '#fff';
    });

    try {
      const mindar = scene.systems['mindar-image-system'];
      await mindar.start();
      clearInterval(ticker);
      setBar(100);
      setTimeout(() => {
        loading.classList.remove('active');
        arUI.classList.add('active');
        mindStarted = true;
      }, 350);
    } catch(e) {
      clearInterval(ticker);
      loading.classList.remove('active');
      arCont.style.display = 'none';
      splash.classList.remove('hidden');
      alert('No se pudo acceder a la cámara. Asegúrate de dar permisos.');
    }
  });

  arClose.addEventListener('click', () => {
    if (mindStarted) {
      document.getElementById('ar-scene').systems['mindar-image-system'].stop();
      mindStarted = false;
    }
    arUI.classList.remove('active');
    arCont.style.display = 'none';
    splash.classList.remove('hidden');
  });
</script>

</body>
</html>
